<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<title>Rhythm Rush</title>
<style>
:root{--bg:#050509;--panel:rgba(8,8,16,.92);--cyan:#32f6ff;--text:#f7f7fb}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}body{touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none;cursor:crosshair}#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;width:min(94vw,760px);display:flex;justify-content:space-between;gap:12px;pointer-events:none;font-weight:800;font-size:clamp(.72rem,2.6vw,1rem);letter-spacing:.04em;text-shadow:0 0 12px rgba(50,246,255,.4)}#songName{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dcdcff}#stats{white-space:nowrap;text-align:right}#menuWrap{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:40}#menuBtn{width:46px;height:46px;border-radius:14px;border:1px solid #40405a;background:rgba(4,4,10,.88);color:#fff;font-size:20px;font-weight:900;cursor:pointer}#panel{display:none;margin-top:8px;width:min(220px,76vw);padding:12px;background:var(--panel);border:1px solid #2f2f45;border-radius:14px}#panel.open{display:block}.btn,select{display:flex;align-items:center;justify-content:center;width:100%;height:42px;margin:5px 0;padding:0 12px;border-radius:9px;border:1px solid #3a3a50;background:#0d0d16;color:#fff;font:700 .9rem Inter,Segoe UI,Arial,sans-serif;cursor:pointer;text-align:center}select{display:block;text-align-last:center}.btn.active{border-color:var(--cyan);color:var(--cyan)}#help,#result{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.88)}.modal{width:min(460px,92vw);background:#0a0a12;border:1px solid #34344b;border-radius:18px;padding:20px;text-align:center}.modal h2{margin:0 0 10px;font-size:1.5rem}.modal p{color:#b0b0c4;line-height:1.55;margin:8px 0}.keys{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--cyan)}#judge{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:18;pointer-events:none;font-weight:1000;font-size:clamp(1.2rem,5vw,2.1rem);letter-spacing:.08em;opacity:0;text-shadow:0 0 18px currentColor}#judge.show{animation:judgePop .42s ease-out}@keyframes judgePop{0%{opacity:0;transform:translate(-50%,-40%) scale(.75)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}@media(max-width:700px){#hud{top:max(8px,env(safe-area-inset-top));font-size:.72rem}#songName{display:none}#menuBtn{width:42px;height:42px;border-radius:12px}#panel{width:194px}.btn,select{height:40px;font-size:.82rem}}
</style>
</head>
<body>
<div id="hud"><div id="songName">RHYTHM RUSH</div><div id="stats">SCORE 0 · CHAIN 0 · PULSE 100%</div></div>
<div id="menuWrap"><button id="menuBtn" aria-label="Menu">☰</button><div id="panel"><select id="mode"><option value="1">Drift</option><option value="2" selected>Pulse</option><option value="3">Surge</option></select><label class="btn" id="songLabel" for="fileInput">Choose Song</label><input id="fileInput" type="file" accept="audio/*,video/mp4" hidden><button class="btn" id="visualBtn">Visual: Reactor</button><button class="btn" id="repeatBtn">Repeat Off</button><button class="btn" id="pauseBtn">Pause</button><button class="btn" id="autoBtn">Manual</button><button class="btn" id="helpBtn">How to Play</button><button class="btn" id="stopBtn">Stop</button></div></div>
<div id="judge"></div>
<div id="help"><div class="modal"><h2>How to Play</h2><p>Notes launch from the glowing core toward 8 floating pads. Tap the matching pad as the diamond reaches it.</p><p>On PC use the spatial keys:</p><p class="keys">Q &nbsp; W &nbsp; E<br>A &nbsp;&nbsp;&nbsp;&nbsp; D<br>Z &nbsp; X &nbsp; C</p><p>Mouse clicks also work. Space pauses.</p><button class="btn" id="closeHelp">Close</button></div></div>
<div id="result"><div class="modal"><h2 id="resultTitle">Song Complete</h2><p id="resultText"></p><button class="btn" id="resultClose">Close</button></div></div>
<canvas id="canvas"></canvas>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d',{alpha:false}),stats=$('stats'),songName=$('songName'),panel=$('panel'),judge=$('judge'),modeEl=$('mode');
let W=innerWidth,H=innerHeight,cx=W/2,cy=H/2,ringR=200,nodeR=38,coreR=100,isPlaying=false,paused=false,score=0,combo=0,maxCombo=0,health=100,notes=[],hue=0,gameState='Manual',rotation=0,lastSpawn=0,lastEnergy=0,avgEnergy=0,beatFlash=0,repeatOn=false,visualMode=0,lastTarget=-1,audioCtx,analyser,dataArray,mediaElement,raf=0,currentFile=null,currentUrl=null,lastFrame=0,lastHud=0,frameNow=0;
const ringNodes=[],particles=[],ripples=[],armedTargets=Array(8).fill(false),targetUse=Array(8).fill(0),keyMap={q:5,w:6,e:7,a:4,d:0,z:3,x:2,c:1},visualNames=['Reactor','Bloom','Prism','Halo','Void'];
const mobile=matchMedia('(max-width:700px)').matches||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent),renderDpr=Math.min(devicePixelRatio||1,mobile?1.35:1.75),particleCount=mobile?42:64,detail=mobile?.68:.85;
function fit(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*renderDpr);canvas.height=Math.round(H*renderDpr);ctx.setTransform(renderDpr,0,0,renderDpr,0,0);cx=W/2;cy=H/2;const portrait=H>W,usable=Math.min(W*.90,H*(portrait?.74:.80));ringR=Math.max(118,Math.min(usable*.43,305));nodeR=Math.max(32,Math.min(48,ringR*.15));coreR=ringR*.58;ringNodes.length=0;for(let i=0;i<8;i++){const a=i*Math.PI/4;ringNodes.push({index:i,x:cx+Math.cos(a)*ringR,y:cy+Math.sin(a)*ringR,flash:0,shake:0,baseHue:i*45})}}
function seedParticles(){particles.length=0;for(let i=0;i<particleCount;i++)particles.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.35,s:Math.random()*.26+.05,h:Math.random()*360,tw:Math.random()*6})}addEventListener('resize',()=>{fit();seedParticles()},{passive:true});fit();seedParticles();
function showJudge(text,color){judge.textContent=text;judge.style.color=color;judge.classList.remove('show');void judge.offsetWidth;judge.classList.add('show')}
function openResult(title){isPlaying=false;cancelAnimationFrame(raf);if(mediaElement)mediaElement.pause();$('resultTitle').textContent=title;$('resultText').textContent=`Score ${score} · Best Chain ${maxCombo}`;$('result').style.display='flex'}
function resetRun(){score=0;combo=0;maxCombo=0;health=100;notes=[];ripples.length=0;armedTargets.fill(false);paused=false;lastSpawn=0;lastEnergy=0;avgEnergy=0;beatFlash=0;lastTarget=-1;lastFrame=0;targetUse.fill(0);stats.textContent='SCORE 0 · CHAIN 0 · PULSE 100%'}
function cleanupAudio(){if(mediaElement){mediaElement.pause();mediaElement.onended=null;mediaElement.src=''}if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}mediaElement=null;analyser=null;dataArray=null}
function stopRun(){if(mediaElement){mediaElement.pause();try{mediaElement.currentTime=0}catch{}}isPlaying=false;cancelAnimationFrame(raf);resetRun();drawIdle()}
async function startFile(file){if(!file)return;currentFile=file;stopRun();cleanupAudio();resetRun();panel.classList.remove('open');songName.textContent=file.name;$('songLabel').textContent='Change Song';mediaElement=document.createElement(file.type.includes('video')?'video':'audio');currentUrl=URL.createObjectURL(file);mediaElement.src=currentUrl;mediaElement.loop=repeatOn;audioCtx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});const src=audioCtx.createMediaElementSource(mediaElement);analyser=audioCtx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.7;src.connect(analyser);analyser.connect(audioCtx.destination);dataArray=new Uint8Array(analyser.frequencyBinCount);mediaElement.onended=()=>{if(!repeatOn)openResult('Song Complete')};try{await mediaElement.play()}catch{}isPlaying=true;lastFrame=performance.now();animate(lastFrame)}
function spawnRipple(x,y,h,a=.9){ripples.push({x,y,r:nodeR*.92,a,h});if(ripples.length>20)ripples.shift()}
function updateArmedTargets(){armedTargets.fill(false);for(const n of notes)if(n.progress>.74)armedTargets[n.target]=true}
function hitNode(index){if(!isPlaying||paused||gameState!=='Manual')return;if(audioCtx?.state==='suspended')audioCtx.resume();const node=ringNodes[index];let best=-1,bestDist=99;for(let i=0;i<notes.length;i++)if(notes[i].target===index){const d=Math.abs(1-notes[i].progress);if(d<bestDist){bestDist=d;best=i}}const hitWindow=[.26,.21,.17][+modeEl.value-1];if(best>=0&&bestDist<=hitWindow){const note=notes[best];notes.splice(best,1);node.flash=1;beatFlash=Math.max(beatFlash,.9);spawnRipple(node.x,node.y,note.h,1);if(bestDist<hitWindow*.3){score+=300;combo++;showJudge('SYNC','#fff')}else if(bestDist<hitWindow*.68){score+=180;combo++;showJudge('LOCK','#32f6ff')}else{score+=100;combo++;showJudge('FLOW','#9a6cff')}maxCombo=Math.max(maxCombo,combo)}else{health=Math.max(0,health-3);combo=0;node.shake=1;spawnRipple(node.x,node.y,350,.65);showJudge('BREAK','#ff5470')}}
function pointerHit(x,y){for(const n of ringNodes)if(Math.hypot(x-n.x,y-n.y)<nodeR*1.7){hitNode(n.index);return}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();pointerHit(e.clientX,e.clientY)},{passive:false});addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k in keyMap){e.preventDefault();hitNode(keyMap[k])}if(e.code==='Space'){e.preventDefault();togglePause()}});
function energyBands(){let low=0,mid=0,high=0,N=dataArray.length,l=Math.floor(N*.12),m=Math.floor(N*.45);for(let i=0;i<N;i++){const v=dataArray[i];if(i<l)low+=v;else if(i<m)mid+=v;else high+=v}return[low/Math.max(1,l),mid/Math.max(1,m-l),high/Math.max(1,N-m)]}
function weightedPick(items,weights){let total=0;for(const w of weights)total+=w;let r=Math.random()*total;for(let i=0;i<items.length;i++){r-=weights[i];if(r<=0)return items[i]}return items[items.length-1]}
function pickTarget(bands){const dominant=bands.indexOf(Math.max(...bands)),preferred=dominant===0?[2,3,4,1,5]:dominant===2?[6,7,0,5,1]:[0,1,4,5,2,6,3,7],minUse=Math.min(...targetUse),starved=[];for(let i=0;i<8;i++)if(targetUse[i]===minUse&&i!==lastTarget)starved.push(i);if(starved.length&&Math.random()<.58)return starved[Math.floor(Math.random()*starved.length)];const maxUse=Math.max(...targetUse),items=[],weights=[];for(let i=0;i<8;i++)if(i!==lastTarget){items.push(i);const p=preferred.indexOf(i);weights.push(1+(p<0?0:(preferred.length-p)*.38)+(maxUse-targetUse[i])*1.65)}return weightedPick(items,weights)}
function spawnNote(bands){const idx=pickTarget(bands);notes.push({target:idx,progress:0,h:(hue+idx*35)%360});targetUse[idx]++;lastTarget=idx;if(Math.max(...targetUse)>18){const min=Math.min(...targetUse);for(let i=0;i<8;i++)targetUse[i]-=min}beatFlash=1}
function maybeSpawn(t,bands){const diff=+modeEl.value,energy=(bands[0]*1.25+bands[1]+bands[2]*.65)/2.9;avgEnergy=avgEnergy*.965+energy*.035;const cooldown=[470,350,255][diff-1],maxGap=[1180,920,720][diff-1],adaptive=Math.max([34,30,26][diff-1],avgEnergy*[1.12,1.09,1.06][diff-1]),rise=energy>lastEnergy+[3.6,2.8,2][diff-1],beatReady=t-lastSpawn>cooldown;if(beatReady&&energy>adaptive&&rise){spawnNote(bands);lastSpawn=t}else if(t-lastSpawn>maxGap){spawnNote(bands);lastSpawn=t}lastEnergy=lastEnergy*.72+energy*.28}
function drawBackground(dt){ctx.fillStyle='#050509';ctx.fillRect(0,0,W,H);const f=dt/16.667;for(const p of particles){p.y+=p.s*f;p.tw+=.018*f;if(p.y>H+4){p.y=-4;p.x=Math.random()*W}ctx.fillStyle=`hsla(${p.h},85%,68%,${.12+Math.sin(p.tw)*.045})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}}
function drawOuterRing(bands){const beat=(bands[0]+bands[1]+bands[2])/765,rr=ringR+nodeR*.58;ctx.save();ctx.translate(cx,cy);ctx.shadowBlur=(10+beatFlash*12)*detail;ctx.shadowColor=`hsl(${hue} 100% 60%)`;ctx.strokeStyle=`hsla(${hue},100%,72%,${.13+beat*.13+beatFlash*.1})`;ctx.lineWidth=2.6+beatFlash*1.5;ctx.beginPath();ctx.arc(0,0,rr,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;for(let i=0;i<8;i++){const a=i*Math.PI/4+rotation*.2;ctx.strokeStyle=`hsla(${hue+i*38},100%,76%,${.2+beatFlash*.06})`;ctx.lineWidth=3.4;ctx.beginPath();ctx.arc(0,0,rr+6,a,a+.34+beat*.05);ctx.stroke()}if(visualMode===3){for(let k=0;k<2;k++){ctx.strokeStyle=`hsla(${hue+80+k*55},100%,76%,${.07+beatFlash*.06})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,rr+15+k*9,0,Math.PI*2);ctx.stroke()}}ctx.restore()}
function drawCore(bands){const bass=bands[0]/255,mid=bands[1]/255,treble=bands[2]/255,pulse=1+beatFlash*.11+bass*.05;drawOuterRing(bands);const glowR=Math.min(ringR-nodeR-8,coreR*(1.12+beatFlash*.1));const g=ctx.createRadialGradient(cx,cy,0,cx,cy,glowR);g.addColorStop(0,`rgba(255,255,255,${.13+beatFlash*.12})`);g.addColorStop(.26,`hsla(${hue},100%,66%,${.16+bass*.11})`);g.addColorStop(.68,`hsla(${hue+80},100%,54%,.06)`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,glowR,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);
if(visualMode===0){for(let j=0;j<3;j++){const rr=coreR*(.4+j*.18)*pulse;ctx.strokeStyle=`hsla(${hue+j*50},100%,74%,${.4-j*.09})`;ctx.lineWidth=3.5-j*.6;for(let i=0;i<6;i++){const a=i*Math.PI/3+rotation*(.25+j*.07)+j*.22;ctx.beginPath();ctx.arc(0,0,rr,a,a+.56+treble*.14);ctx.stroke()}}}
else if(visualMode===1){for(let j=0;j<5;j++){ctx.save();ctx.rotate(j*Math.PI*2/5+rotation*.1);const len=coreR*(.55+beatFlash*.09),wid=coreR*.17+mid*10;ctx.fillStyle=`hsla(${hue+j*45},100%,68%,.09)`;ctx.strokeStyle=`hsla(${hue+j*45},100%,76%,.34)`;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(len*.26,-wid,len*.78,-wid*.65,len,0);ctx.bezierCurveTo(len*.78,wid*.65,len*.26,wid,0,0);ctx.fill();ctx.stroke();ctx.restore()}}
else if(visualMode===2){for(let arm=0;arm<4;arm++){ctx.beginPath();const steps=mobile?30:42;for(let s=0;s<=steps;s++){const p=s/steps,a=p*Math.PI*2.2+arm*Math.PI*.52,r=coreR*(.2+p*.7)*pulse,x=Math.cos(a)*r,y=Math.sin(a)*r;s?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.lineWidth=7-arm;ctx.strokeStyle=`hsla(${hue+arm*72},100%,72%,${.15+arm*.04})`;ctx.stroke()}}
else if(visualMode===3){for(let j=0;j<4;j++){const rr=coreR*(.38+j*.15)*pulse;ctx.strokeStyle=`hsla(${hue+j*44},100%,76%,${.2+j*.05})`;ctx.lineWidth=2.7;ctx.beginPath();ctx.arc(0,0,rr,rotation*(.25+j*.05),rotation*(.25+j*.05)+Math.PI*1.46);ctx.stroke()}}
else{for(let j=0;j<3;j++){const points=8+j*2,outer=coreR*(.5+j*.14)*pulse,inner=outer*.57;ctx.beginPath();for(let i=0;i<=points*2;i++){const a=i/(points*2)*Math.PI*2,r=i%2?inner:outer+(bands[j%3]/255)*5,x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fillStyle=`hsla(${hue+j*70},100%,62%,${.028+j*.014})`;ctx.strokeStyle=`hsla(${hue+j*70},100%,76%,${.24+j*.07})`;ctx.lineWidth=2.4+j*.45;ctx.fill();ctx.stroke()}}
ctx.beginPath();ctx.arc(0,0,coreR*(.22+bass*.035),0,Math.PI*2);ctx.fillStyle=`hsla(${hue+16},100%,74%,.9)`;ctx.shadowBlur=24*detail;ctx.shadowColor=`hsl(${hue} 100% 65%)`;ctx.fill();ctx.restore()}
function drawRipples(dt){const f=dt/16.667;for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=3.1*f;r.a-=.03*f;if(r.a<=0){ripples.splice(i,1);continue}ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.strokeStyle=`hsla(${r.h},100%,76%,${r.a})`;ctx.lineWidth=2.5;ctx.stroke()}}
function drawNodes(dt){const f=dt/16.667;for(const n of ringNodes){n.flash=Math.max(0,n.flash-.065*f);n.shake=Math.max(0,n.shake-.12*f);const sx=(Math.random()-.5)*n.shake*10,sy=(Math.random()-.5)*n.shake*10,armed=armedTargets[n.index],colorShift=Math.sin(frameNow*.0011+n.index*.8)*20,nh=(hue*.8+n.baseHue+colorShift+360)%360;ctx.save();ctx.translate(n.x+sx,n.y+sy);ctx.beginPath();ctx.arc(0,0,nodeR+(armed?8:3)+n.flash*6,0,Math.PI*2);ctx.fillStyle=`hsla(${nh},100%,60%,${(armed?.11:.05)+n.flash*.06})`;ctx.fill();ctx.shadowBlur=(n.flash?28:(armed?20:10))*detail;ctx.shadowColor=`hsl(${nh} 100% 60%)`;const grad=ctx.createRadialGradient(-nodeR*.22,-nodeR*.24,2,0,0,nodeR);grad.addColorStop(0,`hsl(${nh+12} 100% 84%)`);grad.addColorStop(.46,`hsl(${nh} 96% ${n.flash?66:(armed?61:56)}%)`);grad.addColorStop(1,`hsl(${nh+310} 86% 30%)`);ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,nodeR,0,Math.PI*2);ctx.fill();ctx.strokeStyle=n.flash?'#fff':armed?'rgba(255,255,255,.92)':`hsla(${nh},100%,92%,.5)`;ctx.lineWidth=n.flash?5.5:(armed?3.8:2.2);ctx.stroke();if(armed||n.flash){ctx.beginPath();ctx.arc(0,0,nodeR+8+Math.sin(frameNow*.01+n.index)*2+n.flash*4,0,Math.PI*2);ctx.strokeStyle=n.flash?'rgba(255,255,255,.95)':`hsla(${nh+30},100%,85%,.52)`;ctx.lineWidth=n.flash?3.2:1.8;ctx.stroke()}ctx.restore()}}
function drawNotes(){for(const n of notes){const target=ringNodes[n.target],x=cx+(target.x-cx)*n.progress,y=cy+(target.y-cy)*n.progress,prev=Math.max(0,n.progress-.045),tx=cx+(target.x-cx)*prev,ty=cy+(target.y-cy)*prev;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(x,y);ctx.strokeStyle=`hsla(${n.h},100%,72%,.18)`;ctx.lineWidth=2.5;ctx.stroke();ctx.save();ctx.translate(x,y);ctx.rotate(rotation*1.5+n.target*.3);const scale=1+Math.max(0,n.progress-.72)*1.05;ctx.scale(scale,scale);ctx.shadowBlur=mobile?9:14;ctx.shadowColor=`hsl(${n.h} 100% 68%)`;ctx.fillStyle=`hsl(${n.h} 100% 72%)`;ctx.strokeStyle='#fff';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(11,0);ctx.lineTo(0,13);ctx.lineTo(-11,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}}
function updateNotes(dt){const speed=[.0058,.0072,.0087][+modeEl.value-1]*(dt/16.667);for(let i=notes.length-1;i>=0;i--){const n=notes[i];n.progress+=speed;if(gameState==='Auto'&&n.progress>.88){score+=200;combo++;maxCombo=Math.max(maxCombo,combo);ringNodes[n.target].flash=1;spawnRipple(ringNodes[n.target].x,ringNodes[n.target].y,n.h,.9);notes.splice(i,1);continue}if(n.progress>1.18){health=Math.max(0,health-8);combo=0;ringNodes[n.target].shake=1;spawnRipple(ringNodes[n.target].x,ringNodes[n.target].y,350,.55);notes.splice(i,1);showJudge('BREAK','#ff5470')}}}
function drawIdle(){frameNow=performance.now();drawBackground(16.667);drawCore([0,0,0]);updateArmedTargets();drawNodes(16.667)}
function animate(t){if(!isPlaying)return;raf=requestAnimationFrame(animate);if(paused){lastFrame=t;return}frameNow=t;const dt=Math.min(40,Math.max(8,t-lastFrame||16.667));lastFrame=t;analyser.getByteFrequencyData(dataArray);const bands=energyBands(),f=dt/16.667;hue=(hue+.48*f)%360;rotation+=(.0032+.0011*+modeEl.value)*f;beatFlash=Math.max(0,beatFlash-.035*f);drawBackground(dt);drawCore(bands);maybeSpawn(t,bands);updateNotes(dt);updateArmedTargets();drawNotes();drawRipples(dt);drawNodes(dt);if(t-lastHud>80){stats.textContent=`SCORE ${score} · CHAIN ${combo} · PULSE ${Math.floor(health)}%`;lastHud=t}if(health<=0)openResult('Pulse Lost')}
function togglePause(){if(!isPlaying)return;paused=!paused;$('pauseBtn').textContent=paused?'Resume':'Pause';lastFrame=performance.now();if(mediaElement){paused?mediaElement.pause():mediaElement.play()}}
$('menuBtn').onclick=()=>panel.classList.toggle('open');$('fileInput').onchange=e=>startFile(e.target.files[0]);$('visualBtn').onclick=e=>{visualMode=(visualMode+1)%visualNames.length;e.currentTarget.textContent=`Visual: ${visualNames[visualMode]}`;if(!isPlaying)drawIdle()};$('repeatBtn').onclick=e=>{repeatOn=!repeatOn;e.currentTarget.textContent=repeatOn?'Repeat On':'Repeat Off';e.currentTarget.classList.toggle('active',repeatOn);if(mediaElement)mediaElement.loop=repeatOn};$('pauseBtn').onclick=togglePause;$('autoBtn').onclick=e=>{gameState=gameState==='Manual'?'Auto':'Manual';e.currentTarget.textContent=gameState==='Manual'?'Manual':'Visualizer';e.currentTarget.classList.toggle('active',gameState==='Auto')};$('helpBtn').onclick=()=>$('help').style.display='flex';$('closeHelp').onclick=()=>$('help').style.display='none';$('stopBtn').onclick=()=>{stopRun();panel.classList.remove('open')};$('resultClose').onclick=()=>{$('result').style.display='none';stopRun()};document.addEventListener('visibilitychange',()=>{lastFrame=performance.now()});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));drawIdle();
