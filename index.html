<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rhythm Rush (Music Player)</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: 'Calibri', sans-serif; }
        canvas { display: block; cursor: crosshair; touch-action: none; }
        #ui { position: absolute; top: 20px; right: 20px; text-align: right; color: #fff; pointer-events: none; z-index: 30; font-size: 1.2rem; }
        #controls-container { position: absolute; top: 20px; left: 20px; z-index: 30; }
        #controls { background: #000; padding: 15px; border-radius: 10px; border: 1px solid #fff; display: none; width: 180px; }
        .plus-btn { background: none; border: 1px solid #fff; color: white; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; pointer-events: auto; font-size: 20px; }
        .btn { display: block; width: 100%; padding: 12px; margin-top: 10px; box-sizing: border-box; background: #000; border: 1px solid #fff; color: #fff; cursor: pointer; border-radius: 5px; font-family: 'Calibri', sans-serif; font-size: 1rem; text-align: center; }
        #help-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; display: none; z-index: 50; padding: 20px; box-sizing: border-box; text-align: center; pointer-events: none; }
    </style>
</head>
<body>

<div id="ui"><div id="stats">Score: 0 | Combo: 0 | HP: 100%</div></div>

<div id="help-overlay">
    <h2>How to Play</h2>
    <p>1. Choose a song to begin.</p>
    <p>2. Notes (♪, ♫, ♩, ♬) will travel to the 8 buttons.</p>
    <p>3. Tap the buttons exactly when the note arrives.</p>
    <p>4. Keep your health up! Don't miss notes or tap empty buttons.</p>
    <button class="btn" style="pointer-events:auto;" onclick="document.getElementById('help-overlay').style.display='none'">Close</button>
</div>

<div id="controls-container">
    <button class="plus-btn" onclick="toggleControls()">+</button>
    <div id="controls">
        <select id="mode" class="btn"><option value="1">Easy</option><option value="2">Medium</option><option value="3">Hard</option></select>
        <label id="songLabel" class="btn" for="fileInput">Choose Song</label>
        <input type="file" id="fileInput" accept="audio/*,video/mp4" style="display:none">
        <button id="toggleBtn" class="btn" onclick="cycleGameState()">Manual</button>
        <button class="btn" onclick="document.getElementById('help-overlay').style.display='block'">How to Play</button>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    let isPlaying = false, score = 0, combo = 0, health = 100, notes = [], hue = 0, gameState = 'Manual';
    let audioCtx, analyser, dataArray, mediaElement;
    const ringNodes = [], particles = []; 

    function resize() { 
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ringNodes.length = 0;
        const radius = Math.min(canvas.width, canvas.height) * 0.3;
        for(let i=0; i<8; i++) {
            const angle = (i/8) * Math.PI * 2;
            ringNodes.push({ x: canvas.width/2 + Math.cos(angle)*radius, y: canvas.height/2 + Math.sin(angle)*radius, flash: 0, shake: 0, baseHue: (i * 45), pulseOffset: i * 0.5 });
        }
    }
    window.addEventListener('resize', resize); resize();

    function createNebula() {
        for(let i=0; i<60; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, hue: Math.random()*360 });
    }
    createNebula();

    function toggleControls() { const c = document.getElementById('controls'); c.style.display = c.style.display === 'block' ? 'none' : 'block'; }
    function endGame(won) { isPlaying = false; if(mediaElement) mediaElement.pause(); alert((won ? "Song Complete! " : "Game Over! ") + "Final Score: " + score); location.reload(); }
    function cycleGameState() { const states = ['Manual', 'Auto', 'Stop']; let idx = states.indexOf(gameState); gameState = states[(idx + 1) % 3]; document.getElementById('toggleBtn').innerText = gameState; if(gameState === 'Stop') endGame(false); }

    document.getElementById('fileInput').onchange = function() {
        if(isPlaying) return;
        document.getElementById('controls').style.display = 'none';
        mediaElement = document.createElement(this.files[0].type.includes('video') ? 'video' : 'audio');
        mediaElement.src = URL.createObjectURL(this.files[0]);
        mediaElement.play();
        mediaElement.onended = () => endGame(true);
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaElementSource(mediaElement);
        analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
        source.connect(analyser); analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        isPlaying = true;
        animate();
    };

    function handleInput(x, y) {
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        if (gameState !== 'Manual') return;
        ringNodes.forEach((n) => {
            if(Math.hypot(x - n.x, y - n.y) < 70) {
                let hit = false;
                notes = notes.filter(note => {
                    if(note.target === n && note.progress > 0.7 && note.progress < 1.1) {
                        score += 100; combo++; hit = true; n.flash = 1; return false;
                    }
                    return true;
                });
                if(!hit) { health -= 5; combo = 0; n.shake = 1; }
            }
        });
    }

    canvas.addEventListener('mousedown', e => handleInput(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', e => { e.preventDefault(); for(let t of e.touches) handleInput(t.clientX, t.clientY); }, {passive: false});

    function animate() {
        if (!isPlaying) return;
        requestAnimationFrame(animate);
        analyser.getByteFrequencyData(dataArray);
        hue = (hue + 2) % 360;
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x<0 || p.x>canvas.width) p.vx *= -1; if(p.y<0 || p.y>canvas.height) p.vy *= -1;
            ctx.fillStyle = `hsla(${p.hue}, 80%, 60%, 0.4)`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });

        let sum = 0; for(let i=0; i<10; i++) sum += dataArray[i];
        const rhythmPulse = (sum / 10) / 50;

        for(let i=0; i<dataArray.length; i++) {
            const angle = (i / dataArray.length) * Math.PI * 2;
            const r = (dataArray[i] * (Math.min(canvas.width, canvas.height) / 400));
            ctx.beginPath(); ctx.strokeStyle = `hsla(${hue}, 100%, 50%, 0.3)`;
            ctx.moveTo(canvas.width/2, canvas.height/2);
            ctx.lineTo(canvas.width/2 + Math.cos(angle)*(150+r), canvas.height/2 + Math.sin(angle)*(150+r));
            ctx.stroke();
        }

        if (Math.random() > 0.98) {
            const idx = Math.floor(Math.random()*8);
            notes.push({ progress: 0, target: ringNodes[idx], hue, symbol: ['♪','♫','♩','♬'][Math.floor(Math.random()*4)], history: [] });
        }

        ringNodes.forEach(n => {
            n.flash = Math.max(0, n.flash - 0.1); n.shake = Math.max(0, n.shake - 0.1);
            const idlePulse = 0.9 + (Math.sin(Date.now() * 0.003 + n.pulseOffset) * 0.1);
            const currentLightHue = (n.baseHue + hue) % 360;
            const offsetX = (Math.random() - 0.5) * n.shake * 20;
            const offsetY = (Math.random() - 0.5) * n.shake * 20;
            const isArmed = notes.some(note => note.target === n && note.progress > 0.95);
            const isActive = (n.flash > 0 || isArmed);

            ctx.shadowBlur = isActive ? (30 + rhythmPulse) : 5;
            ctx.shadowColor = `hsla(${currentLightHue}, 100%, 50%, 0.8)`;
            const grad = ctx.createRadialGradient(n.x + offsetX, n.y + offsetY, 0, n.x + offsetX, n.y + offsetY, 60 * idlePulse);
            if (isActive) {
                grad.addColorStop(0, "#ffffff"); grad.addColorStop(0.3, "#ffff00"); grad.addColorStop(0.6, `hsla(${currentLightHue}, 100%, 50%, 1)`); grad.addColorStop(1, "transparent");
            } else { grad.addColorStop(0, "#333"); grad.addColorStop(1, "#111"); }
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(n.x + offsetX, n.y + offsetY, (40 + n.flash*20 + rhythmPulse) * idlePulse, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        });
        
        notes.forEach((n, i) => {
            n.progress += 0.005 + (parseInt(document.getElementById('mode').value)*0.002);
            if (gameState === 'Auto' && n.progress > 0.85) { score += 100; combo++; n.target.flash = 1; notes.splice(i, 1); }
            else if(n.progress >= 1) { notes.splice(i, 1); health -= 10; combo = 0; n.target.shake = 1; }
            else {
                const x = canvas.width/2 + (n.target.x - canvas.width/2) * n.progress;
                const y = canvas.height/2 + (n.target.y - canvas.height/2) * n.progress;
                n.history.push({x, y}); if(n.history.length > 3) n.history.shift();
                n.history.forEach((h, j) => { ctx.fillStyle = `hsla(0, 0%, 100%, ${(j+1)/3})`; ctx.font = `${20 + j*5}px Calibri`; ctx.fillText(n.symbol, h.x, h.y); });
            }
        });

        document.getElementById('stats').innerText = `Score: ${score} | Combo: ${combo} | HP: ${Math.floor(health)}%`;
        if (health <= 0) endGame(false);
    }
</script>
</body>
</html>
